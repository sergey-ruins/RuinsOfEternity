<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ruins of Eternity — Глава I</title>
<style>
html,body{margin:0;background:#08090b;color:#eee;font-family:system-ui,Arial;overflow:hidden;height:100%}
canvas{display:block;width:100vw;height:100vh;background:#10151a}
#hud{position:fixed;left:12px;top:10px;background:#0009;border:1px solid #ffffff22;border-radius:12px;padding:9px 12px;font-size:14px;line-height:1.45;backdrop-filter:blur(5px)}
#msg{position:fixed;left:50%;top:8%;transform:translateX(-50%);background:#000b;padding:12px 18px;border-radius:12px;display:none;text-align:center;max-width:80%}
#dialog{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);width:min(700px,88vw);background:#090909ee;border:1px solid #caa75b66;border-radius:15px;padding:15px;display:none}
#dialog b{color:#e5c16b} #choices button{margin:7px 5px 0 0}
button{background:#252a31;color:#fff;border:1px solid #ffffff25;border-radius:10px;padding:10px 14px;font-size:15px}
#touch{position:fixed;inset:auto 0 14px 0;display:flex;justify-content:space-between;padding:0 16px;pointer-events:none}
.pad,.acts{display:grid;gap:8px;pointer-events:auto}.pad{grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px)}.acts{grid-template-columns:repeat(2,64px)}
.t{opacity:.82;width:52px;height:52px;padding:0;border-radius:50%}.a{width:64px;height:64px;border-radius:50%}
@media(min-width:900px){#touch{opacity:.25}.t,.a{width:46px;height:46px}.a{width:55px;height:55px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">ГЛАВА I — ПЕПЕЛ У ВОРОТ<br>
❤️ <span id="hp">100</span>/100 &nbsp; ⚡ <span id="st">100</span>/100<br>
⚔️ <span id="weapon">Ржавый меч +0</span> &nbsp; 💰 <span id="gold">250</span><br>
🕳️ Пещера: <span id="cave">не найдена</span><br>
🎯 Цель: добраться до ворот Руин
</div>
<div id="msg"></div>
<div id="dialog"><b id="who"></b><div id="text" style="margin-top:7px"></div><div id="choices"></div></div>
<div id="touch">
 <div class="pad">
  <button class="t" data-k="a">↖</button><button class="t" data-k="w">↑</button><button class="t" data-k="d">↗</button>
  <button class="t" data-k="a2">←</button><button class="t" data-k="s">↓</button><button class="t" data-k="d2">→</button>
 </div>
 <div class="acts">
  <button class="a" data-act="attack">⚔️</button><button class="a" data-act="dodge">💨</button>
  <button class="a" data-act="interact">E</button><button class="a" data-act="heavy">💥</button>
 </div>
</div>
<script>
const c=document.getElementById('game'),x=c.getContext('2d');let W,H;
function resize(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();
const world={w:2600,h:1800},p={x:340,y:900,r:18,hp:100,st:100,atk:0,dodge:0,weapon:0};
const keys={};let msgTimer=0, dialogOpen=false, boss=null, chest=false, cave=false, quest=0, kolyaTrust=0, egorTalk=false;
const weapons=[['Ржавый меч',18],['Клык Палача',62],['Катана Алого Ветра',39],['Чёрная Катана',32]];
const enemies=[
 {x:700,y:730,r:24,hp:75,max:75,name:'Разбойник Пепла'},
 {x:870,y:1040,r:24,hp:85,max:85,name:'Разбойник Пепла'},
 {x:1130,y:760,r:27,hp:110,max:110,name:'Охотник Руин'}
];
const areas=[
 {x:100,y:100,w:2400,h:1600,col:'#17211a'},
 {x:150,y:660,w:520,h:480,col:'#202a20'},
 {x:1700,y:250,w:650,h:520,col:'#24231f'}
];
function say(t){const m=document.getElementById('msg');m.textContent=t;m.style.display='block';msgTimer=180}
function openDialog(who,text,opts){dialogOpen=true;document.getElementById('who').textContent=who;document.getElementById('text').textContent=text;const q=document.getElementById('choices');q.innerHTML='';opts.forEach(o=>{let b=document.createElement('button');b.textContent=o[0];b.onclick=()=>{dialogOpen=false;document.getElementById('dialog').style.display='none';o[1]()};q.appendChild(b)});document.getElementById('dialog').style.display='block'}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function near(obj,r=90){return dist(p,obj)<r}
function attack(heavy=false){
 if(dialogOpen)return;
 if(p.atk>0)return;
 p.atk=heavy?22:12;p.st-=heavy?18:6;if(p.st<0){p.st=0;return}
 const range=heavy?95:72, dmg=(heavy?35:weapons[p.weapon][1]);
 enemies.forEach(e=>{if(e.hp>0&&dist(p,e)<range)e.hp-=dmg});
 if(boss&&boss.hp>0&&dist(p,boss)<range){boss.hp-=dmg;if(boss.hp<=boss.max*.65&&boss.phase<2){boss.phase=2;say('АЛЬФА-ВОЛК: фаза II! Он становится быстрее.')} if(boss.hp<=boss.max*.3&&boss.phase<3){boss.phase=3;say('АЛЬФА-ВОЛК: последняя фаза!')}}
}
function interact(){
 if(dialogOpen)return;
 if(near({x:420,y:810},110)){openDialog('Егор','Егор: «Оружие не вечно. Но хорошая сталь переживёт нас обоих.»',[
  ['Улучшить меч — 100 золота',()=>{if(p.gold>=100){p.gold-=100;p.weapon=1;say('Егор улучшил оружие: Клык Палача +1')}else say('Егор: «У тебя денег меньше, чем у меня терпения.»')}],
  ['Просто поговорить',()=>say('Егор: «В каждой главе я буду ждать тебя. Только не тащи ко мне ржавьё.»')]
 ]);return}
 if(near({x:540,y:830},110)){openDialog('Коля','Коля: «Покупай сейчас. Потом будет дороже. Я человек честный — просто очень жадный.»',[
  ['Купить зелье — 40 золота',()=>{if(p.gold>=40){p.gold-=40;p.hp=Math.min(100,p.hp+45);say('Коля продал зелье. И ухмыльнулся.')}else say('Коля: «Сначала деньги, герой.»')}],
  ['Спросить о Руинах',()=>{kolyaTrust++;say('Коля: «Я знаю дорогу. Но за знания обычно платят.»')}]
 ]);return}
 if(near({x:980,y:900},110)&&!chest){chest=true;p.gold+=180;p.weapon=2;say('Скрытый сундук! Ты нашёл Катану Алого Ветра и 180 золота.');return}
 if(near({x:1320,y:500},120)&&!cave){cave=true;p.gold+=100;say('Ты обнаружил скрытый вход в пещеру. Внутри — материалы и тайник.');return}
 if(near({x:2200,y:900},150)&&!boss){boss={x:2200,y:900,r:55,hp:1300,max:1300,phase:1};say('АРЕНА: Волчий Клык. Главный босс — АЛЬФА-ВОЛК!');return}
 if(boss&&boss.hp<=0){say('Победа! Уникальное добивание завершило бой. Получен Клык Палача.');p.weapon=1;quest=2;boss=null;return}
}
function update(){
 if(p.atk>0)p.atk--;if(p.dodge>0)p.dodge--;if(p.st<100)p.st+=.18;
 let dx=(keys.w?1:0)+(keys.s?-1:0),dy=(keys.d2?1:0)+(keys.a2?-1:0);
 if(keys.a)dy-=.7;if(keys.d)dy+=.7;
 if(dx||dy){let l=Math.hypot(dx,dy);p.x+=dx/l*3.1;p.y+=dy/l*3.1}
 p.x=Math.max(30,Math.min(world.w-30,p.x));p.y=Math.max(30,Math.min(world.h-30,p.y));
 enemies.forEach(e=>{if(e.hp>0&&dist(p,e)<500){let dx=p.x-e.x,dy=p.y-e.y,l=Math.hypot(dx,dy);e.x+=dx/l*.45;e.y+=dy/l*.45;if(l<45&&p.dodge<=0)p.hp-=.18}});
 if(boss&&boss.hp>0){let dx=p.x-boss.x,dy=p.y-boss.y,l=Math.hypot(dx,dy);if(l<700){boss.x+=dx/l*.65;boss.y+=dy/l*.65;if(l<85&&p.dodge<=0)p.hp-=.5}}
 if(p.hp<=0){p.hp=100;p.x=340;p.y=900;say('Ты погиб. Путь начинается заново, но найденные секреты запоминаются.')}
}
function draw(){
 x.clearRect(0,0,innerWidth,innerHeight);let camx=Math.max(0,Math.min(world.w-innerWidth,p.x-innerWidth/2)),camy=Math.max(0,Math.min(world.h-innerHeight,p.y-innerHeight/2));
 x.save();x.translate(-camx,-camy);
 x.fillStyle='#151b18';x.fillRect(0,0,world.w,world.h);
 // paths / areas
 x.fillStyle='#3a3429';x.fillRect(0,800,2600,200);x.fillRect(1200,0,170,1800);
 x.fillStyle='#263425';for(let i=0;i<120;i++){let tx=(i*233)%2500,ty=(i*97)%1700;x.fillRect(tx,ty,45,70)}
 // cave, NPCs, chest
 x.fillStyle='#070809';x.beginPath();x.arc(1320,500,70,0,7);x.fill();label('ПЕЩЕРА',1320,430);
 rect('#b98d52',980,900,40,40);label('СУНДУК',1000,880);
 person('#b85f31',420,810,'ЕГОР');person('#171717',540,830,'КОЛЯ');
 // gate
 rect('#9b8760',2200,820,45,160);label('АРЕНА',2220,790);
 enemies.forEach(e=>{if(e.hp>0){person('#8b4035',e.x,e.y,e.name);bar(e.x,e.y-35,e.hp/e.max, '#b44') }});
 if(boss){person('#b9b6a6',boss.x,boss.y,'АЛЬФА-ВОЛК');bar(boss.x,boss.y-70,boss.hp/boss.max,'#d05');}
 person('#d9d0b8',p.x,p.y,'ТЫ');
 x.restore();
 document.getElementById('hp').textContent=Math.max(0,Math.floor(p.hp));document.getElementById('st').textContent=Math.floor(p.st);document.getElementById('gold').textContent=p.gold||250;document.getElementById('weapon').textContent=weapons[p.weapon][0]+' +'+(p.weapon===1?'1':'0');document.getElementById('cave').textContent=cave?'найдена':'не найдена';
 if(msgTimer>0){msgTimer--;if(msgTimer===0)document.getElementById('msg').style.display='none'}
}
function rect(col,a,b,w,h){x.fillStyle=col;x.fillRect(a,b,w,h)}
function person(col,a,b,t){x.fillStyle=col;x.beginPath();x.arc(a,b,22,0,7);x.fill();label(t,a,b-32)}
function label(t,a,b){x.fillStyle='#fff';x.font='bold 13px system-ui';x.textAlign='center';x.fillText(t,a,b)}
function bar(a,b,v,col){rect('#000',a-35,b,70,7);rect(col,a-35,b,70*Math.max(0,v),7)}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='e')interact();if(e.key==='q'){p.weapon=(p.weapon+1)%weapons.length}if(e.key===' '){p.dodge=18;p.st= Math.max(0,p.st-15)}if(e.key==='f')attack(true);if(e.key==='Enter')attack(false)});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
document.querySelectorAll('[data-k]').forEach(b=>{b.onpointerdown=()=>keys[b.dataset.k]=true;b.onpointerup=()=>keys[b.dataset.k]=false;b.onpointerleave=()=>keys[b.dataset.k]=false});
document.querySelectorAll('[data-act]').forEach(b=>{b.onpointerdown=()=>({attack:()=>attack(false),heavy:()=>attack(true),dodge:()=>{p.dodge=18;p.st=Math.max(0,p.st-15)},interact:interact}[b.dataset.act])()});
p.gold=250;say('Глава I начинается. Найди Егора, Колю и путь к воротам Руин.');
function loop(){update();draw();requestAnimationFrame(loop)}loop();
</script>
</body></html>
